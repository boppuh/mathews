          &lt;span class=&quot;arch-node-inner&quot;&gt;&lt;span class=&quot;arch-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;Hermes&lt;/span&gt;&lt;span class=&quot;arch-step text-small&quot;&gt;6&lt;/span&gt;&lt;/span&gt;
        &lt;/button&gt;
        &lt;button class=&quot;btn arch-node&quot; type=&quot;button&quot; data-node=&quot;github&quot; data-family=&quot;execution&quot; data-step=&quot;10&quot; aria-pressed=&quot;false&quot;&gt;
          &lt;span class=&quot;arch-node-inner&quot;&gt;&lt;span class=&quot;arch-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;GitHub App &amp;amp; API&lt;/span&gt;&lt;span class=&quot;arch-step text-small&quot;&gt;10&lt;/span&gt;&lt;/span&gt;
        &lt;/button&gt;
        &lt;button class=&quot;btn arch-node&quot; type=&quot;button&quot; data-node=&quot;ci&quot; data-family=&quot;record&quot; data-step=&quot;10&quot; aria-pressed=&quot;false&quot;&gt;
          &lt;span class=&quot;arch-node-inner&quot;&gt;&lt;span class=&quot;arch-dot&quot;&gt;&lt;/span&gt;&lt;span&gt;CI checks &amp;amp; reviews&lt;/span&gt;&lt;span class=&quot;arch-step text-small&quot;&gt;10&lt;/span&gt;&lt;/span&gt;

  &lt;div class=&quot;arch-legend&quot;&gt;
    &lt;div class=&quot;arch-legend-items text-small&quot; aria-label=&quot;Connection legend&quot;&gt;
      &lt;span class=&quot;arch-legend-item&quot;&gt;&lt;span class=&quot;arch-line&quot;&gt;&lt;/span&gt;Authorized command&lt;/span&gt;
      &lt;span class=&quot;arch-legend-item&quot;&gt;&lt;span class=&quot;arch-line event&quot;&gt;&lt;/span&gt;Signed event&lt;/span&gt;
      &lt;span class=&quot;arch-legend-item&quot;&gt;&lt;span class=&quot;arch-line evidence&quot;&gt;&lt;/span&gt;Evidence&lt;/span&gt;
      &lt;span class=&quot;arch-legend-item&quot;&gt;&lt;span class=&quot;arch-line authority&quot;&gt;&lt;/span&gt;Policy gate&lt;/span&gt;
    &lt;/div&gt;
    &lt;span class=&quot;text-small text-muted&quot; id=&quot;mathews-arch-mode-note&quot;&gt;Select any component to trace its direct dependencies.&lt;/span&gt;
  &lt;/div&gt;

  &lt;ol class=&quot;arch-bindings text-small&quot; aria-label=&quot;Exact version binding chain&quot;&gt;
    &lt;li&gt;&lt;code&gt;repository + base SHA&lt;/code&gt;&lt;/li&gt;
    &lt;li&gt;&lt;code&gt;brief + policy + prompts&lt;/code&gt;&lt;/li&gt;
    &lt;li&gt;&lt;code&gt;validation contract&lt;/code&gt;&lt;/li&gt;
    &lt;li&gt;&lt;code&gt;commit + tree&lt;/code&gt;&lt;/li&gt;
    &lt;li&gt;&lt;code&gt;PR head&lt;/code&gt;&lt;/li&gt;
    &lt;li&gt;&lt;code&gt;human handoff&lt;/code&gt;&lt;/li&gt;
  &lt;/ol&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;mathews-architecture-map&quot;);
      const stage = document.getElementById(&quot;mathews-arch-stage&quot;);
      const svg = document.getElementById(&quot;mathews-arch-connectors&quot;);
      const paths = document.getElementById(&quot;mathews-arch-paths&quot;);
      const detailName = document.getElementById(&quot;mathews-arch-detail-name&quot;);
      const detailText = document.getElementById(&quot;mathews-arch-detail-text&quot;);
      const modeNote = document.getElementById(&quot;mathews-arch-mode-note&quot;);
      const nodes = Array.from(root.querySelectorAll(&quot;[data-node]&quot;));
      const modeButtons = Array.from(root.querySelectorAll(&quot;[data-mode-button]&quot;));

      const details = {
        operator: &quot;The authenticated local owner supplies intent, approves exact versions, can cancel or steer work, and performs explicit handoff.&quot;,
        web: &quot;Authenticated UI for intake, steering, approvals, repository preflight, evidence inspection, and explicit human handoff.&quot;,
        reviewer: &quot;A human reviews the exact draft-PR head; review feedback never grants authority by itself.&quot;,
        api: &quot;FastAPI boundary enforcing local authentication, CSRF, canonical repository scope, bounded inputs, and safe responses.&quot;,
        workflow: &quot;Audited task state machine coordinating briefing, approval, execution, validation, review, readiness, and handoff.&quot;,
        worker: &quot;Leased durable jobs with fencing, idempotency, retries, cancellation, outage escalation, and restart reconciliation.&quot;,
        authority: &quot;Immutable policy versions, promoted role prompts, approval records, repository binding, review rules, and rollback lineage.&quot;,
        postgres: &quot;Authoritative ledger for tasks, events, leases, approvals, evidence metadata, exact-version bindings, and recovery state.&quot;,
        artifacts: &quot;Content-addressed evidence and build artifacts with hash verification, access classes, retention, correction, and tombstones.&quot;,
        host: &quot;Authenticated private-socket agent that alone performs allowlisted filesystem, Git, build, test, and simulator effects.&quot;,
        worktree: &quot;One task-owned workspace and controlled branch bound to a frozen base revision, candidate commit, and tree.&quot;,
        simulator: &quot;Pinned Xcode scheme and deterministic simulator flow producing typed results for the exact candidate SHA.&quot;,
        hermes: &quot;Receives bounded prompts and mediated tools; it never receives raw credentials, host access, or merge authority.&quot;,
        github: &quot;Least-privilege App publishes the verified draft PR and ingests signed, idempotent PR, check, and review events.&quot;,
        ci: &quot;External checks and review state are accepted only for the current exact PR head and become durable evidence.&quot;
      };

      const edges = [
        { from: &quot;operator&quot;, to: &quot;web&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;web&quot;, to: &quot;api&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;reviewer&quot;, to: &quot;github&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;api&quot;, to: &quot;workflow&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;authority&quot;, to: &quot;workflow&quot;, type: &quot;authority&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;, &quot;trust&quot;] },
        { from: &quot;workflow&quot;, to: &quot;worker&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;worker&quot;, to: &quot;hermes&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;worker&quot;, to: &quot;host&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;, &quot;trust&quot;] },
        { from: &quot;host&quot;, to: &quot;worktree&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;host&quot;, to: &quot;simulator&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;host&quot;, to: &quot;github&quot;, type: &quot;command&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;github&quot;, to: &quot;ci&quot;, type: &quot;event&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;] },
        { from: &quot;ci&quot;, to: &quot;api&quot;, type: &quot;event&quot;, modes: [&quot;overview&quot;, &quot;golden&quot;, &quot;trust&quot;] },
        { from: &quot;github&quot;, to: &quot;api&quot;, type: &quot;event&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] },
        { from: &quot;api&quot;, to: &quot;postgres&quot;, type: &quot;evidence&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] },
        { from: &quot;workflow&quot;, to: &quot;postgres&quot;, type: &quot;evidence&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] },
        { from: &quot;worker&quot;, to: &quot;postgres&quot;, type: &quot;evidence&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] },
        { from: &quot;authority&quot;, to: &quot;postgres&quot;, type: &quot;authority&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] },
        { from: &quot;worktree&quot;, to: &quot;artifacts&quot;, type: &quot;evidence&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] },
        { from: &quot;simulator&quot;, to: &quot;artifacts&quot;, type: &quot;evidence&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] },
        { from: &quot;github&quot;, to: &quot;artifacts&quot;, type: &quot;evidence&quot;, modes: [&quot;overview&quot;, &quot;trust&quot;] }
      ];

      const modeNodes = {
        overview: new Set(nodes.map((node) =&gt; node.dataset.node)),
        golden: new Set([&quot;operator&quot;, &quot;web&quot;, &quot;api&quot;, &quot;workflow&quot;, &quot;authority&quot;, &quot;worker&quot;, &quot;hermes&quot;, &quot;host&quot;, &quot;worktree&quot;, &quot;simulator&quot;, &quot;github&quot;, &quot;ci&quot;, &quot;reviewer&quot;]),
        trust: new Set([&quot;operator&quot;, &quot;reviewer&quot;, &quot;api&quot;, &quot;workflow&quot;, &quot;worker&quot;, &quot;authority&quot;, &quot;postgres&quot;, &quot;artifacts&quot;, &quot;host&quot;, &quot;worktree&quot;, &quot;simulator&quot;, &quot;github&quot;, &quot;ci&quot;])
      };

      const notes = {
        overview: &quot;Select any component to trace its direct dependencies.&quot;,
        golden: &quot;Numbers follow intake → implementation → validation → review → handoff.&quot;,
        trust: &quot;Dashed paths show where policy, signatures, and immutable evidence constrain effects.&quot;
      };

      let mode = &quot;overview&quot;;
      let selected = &quot;workflow&quot;;

      function nodeElement(id) {
        return root.querySelector(`[data-node=&quot;${id}&quot;]`);
      }

      function connectorPath(from, to) {
        const stageBox = stage.getBoundingClientRect();
        const fromBox = nodeElement(from).getBoundingClientRect();
        const toBox = nodeElement(to).getBoundingClientRect();
        const x1 = fromBox.left + fromBox.width / 2 - stageBox.left;
        const y1 = fromBox.top + fromBox.height / 2 - stageBox.top;
        const x2 = toBox.left + toBox.width / 2 - stageBox.left;
        const y2 = toBox.top + toBox.height / 2 - stageBox.top;
        const bend = Math.max(26, Math.abs(y2 - y1) * 0.34);
        const direction = y2 &gt;= y1 ? 1 : -1;
        return `M ${x1} ${y1} C ${x1} ${y1 + bend * direction}, ${x2} ${y2 - bend * direction}, ${x2} ${y2}`;
      }

      function drawConnections() {
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
        paths.replaceChildren();
        edges.filter((edge) =&gt; edge.modes.includes(mode)).forEach((edge) =&gt; {
          const path = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, &quot;path&quot;);
          path.setAttribute(&quot;d&quot;, connectorPath(edge.from, edge.to));
          path.setAttribute(&quot;data-type&quot;, edge.type);
          path.setAttribute(&quot;marker-end&quot;, `url(#mathews-arrow-${edge.type})`);
          const related = edge.from === selected || edge.to === selected;
          path.style.opacity = selected &amp;&amp; !related ? &quot;0.18&quot; : &quot;0.78&quot;;
          path.style.strokeWidth = related ? &quot;2.6&quot; : &quot;1.6&quot;;
          paths.appendChild(path);
        });
      }

      function updateSelection(id) {
        selected = id;
        const related = new Set([id]);
        edges.filter((edge) =&gt; edge.modes.includes(mode)).forEach((edge) =&gt; {
          if (edge.from === id) related.add(edge.to);
          if (edge.to === id) related.add(edge.from);
        });
        nodes.forEach((node) =&gt; {
          const isSelected = node.dataset.node === id;
          node.classList.toggle(&quot;is-selected&quot;, isSelected);
          node.classList.toggle(&quot;is-muted&quot;, !related.has(node.dataset.node));
          node.setAttribute(&quot;aria-pressed&quot;, String(isSelected));
        });
        detailName.textContent = nodeElement(id).querySelector(&quot;.arch-node-inner span:nth-child(2)&quot;).textContent;
        detailText.textContent = details[id];
        drawConnections();
      }

      function updateMode(nextMode) {
        mode = nextMode;
        root.dataset.mode = mode;
        modeButtons.forEach((button) =&gt; {
          const active = button.dataset.modeButton === mode;
          button.classList.toggle(&quot;btn-primary&quot;, active);
          button.setAttribute(&quot;aria-pressed&quot;, String(active));
        });
        modeNote.textContent = notes[mode];
        nodes.forEach((node) =&gt; {
          node.hidden = false;
          node.classList.toggle(&quot;is-muted&quot;, !modeNodes[mode].has(node.dataset.node));
        });
        updateSelection(mode === &quot;trust&quot; ? &quot;authority&quot; : mode === &quot;golden&quot; ? &quot;workflow&quot; : &quot;workflow&quot;);
      }

      nodes.forEach((node) =&gt; {
        node.addEventListener(&quot;click&quot;, () =&gt; updateSelection(node.dataset.node));
      });
      modeButtons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; updateMode(button.dataset.modeButton));
      });

      const observer = new ResizeObserver(() =&gt; drawConnections());
      observer.observe(stage);
      updateMode(&quot;overview&quot;);
    })();
  &lt;/script&gt;
&lt;/div&gt;


&lt;style id=&quot;codex-visualization-document-scrollbar&quot;&gt;html,body{scrollbar-width:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}&lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot; integrity=&quot;sha256-aYXOZhFTwB2X9r6bq7apVm+SPHFsK3++rUj7sJ9Bm6g=&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot; integrity=&quot;sha256-uBmfdq3MubF7OrVxJMQlhdwZGXEn0aXRkwfRmD+AvYk=&quot; crossorigin=&quot;anonymous&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
