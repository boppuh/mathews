name: mathews

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MATHEWS_POSTGRES_DB:-mathews}
      POSTGRES_PASSWORD: ${MATHEWS_POSTGRES_PASSWORD:-mathews}
      POSTGRES_USER: ${MATHEWS_POSTGRES_USER:-mathews}
    ports:
      - "${MATHEWS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MATHEWS_POSTGRES_USER:-mathews} -d ${MATHEWS_POSTGRES_DB:-mathews}",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mathews-postgres:/var/lib/postgresql/data

volumes:
  mathews-postgres:
