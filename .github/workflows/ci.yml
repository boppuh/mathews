name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: mathews_test
          POSTGRES_PASSWORD: mathews_ci
          POSTGRES_USER: mathews_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=mathews_ci --dbname=mathews_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: npm
          node-version: "22"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --locked --all-packages

      - name: Run repository checks
        run: npm run check

      - name: Build workspace
        run: npm run build

      - name: Prove infrastructure against PostgreSQL
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://mathews_ci:mathews_ci@127.0.0.1:5432/mathews_test
        run: uv run pytest -q services/control-plane/tests/test_infrastructure_postgres.py
